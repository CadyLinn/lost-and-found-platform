global:
  scrape_interval: 5s

scrape_configs:
  - job_name: lost-and-found
    metrics_path: /actuator/prometheus
    static_configs:
      # The backend runs on your Mac (./gradlew bootRun), not in Docker.
      # host.docker.internal is how a Docker container reaches the Mac it runs on.
      - targets: ["host.docker.internal:8081"]
