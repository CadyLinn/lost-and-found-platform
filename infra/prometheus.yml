global:
  scrape_interval: 5s

scrape_configs:
  - job_name: lost-and-found
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          # Backend running on your Mac with ./gradlew bootRun.
          # host.docker.internal is how a Docker container reaches the Mac it runs on.
          - host.docker.internal:8081
          # Backend running in Docker (docker compose --profile app). Only one of the two is usually up.
          - backend:8081
