# Local infrastructure, plus optional profiles:
#
#   docker compose up -d                          Postgres + Redis only (for ./gradlew bootRun + npm run dev)
#   docker compose --profile app up -d --build    the whole site in containers → http://localhost:8000
#   docker compose --profile monitoring up -d     Prometheus + Grafana → http://localhost:3000
#
# Settings come from infra/.env (copy .env.example to .env first).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 127.0.0.1 = only reachable from this Mac, not from other devices on the same Wi-Fi.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- The application (profile: app) ----

  backend:
    build: ../backend
    image: lost-and-found-backend:local
    profiles: [app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      # Required. The backend refuses to start without a secret of 32+ characters.
      JWT_SECRET: ${JWT_SECRET:-}
      # Set to true once the site is served over HTTPS.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      # nginx sits in front: trust its X-Forwarded-For so rate limits see the real client IP.
      SERVER_FORWARD_HEADERS_STRATEGY: native
    # No ports published: only nginx (and Prometheus on 8081) can reach the backend.
    restart: unless-stopped

  frontend:
    build: ../frontend
    image: lost-and-found-frontend:local
    profiles: [app]
    depends_on: [backend]
    ports:
      - "127.0.0.1:8000:80"
    restart: unless-stopped

  # ---- Monitoring (profile: monitoring) ----

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Local only: open the dashboard without logging in (read-only).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lost-and-found.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
