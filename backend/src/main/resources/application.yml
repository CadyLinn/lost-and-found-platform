spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/lostfound
    username: lostfound
    password: lostfound123
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiration-minutes: 15
    refresh-expiration-days: 7
    # The refresh cookie is only sent over HTTPS when true. Keep false for local http://localhost.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  rate-limit:
    enabled: true
    login-per-minute: 10   # per IP address
    max-failed-logins: 5   # per account, in 15 minutes
