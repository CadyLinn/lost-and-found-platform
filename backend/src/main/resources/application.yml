spring:
  application:
    name: backend
  datasource:
    # Defaults are for local development. Hosts like Render pass DB_HOST etc. (or SPRING_DATASOURCE_URL).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lostfound}
    username: ${DB_USER:lostfound}
    password: ${DB_PASSWORD:lostfound123}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

server:
  # Render (and similar hosts) tell the app which port to listen on.
  port: ${PORT:8080}

management:
  # Actuator (health + metrics) runs on its own port, so it is never reachable through the public port 8080.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Lets Prometheus/Grafana compute p50/p95/p99 latency per endpoint.
      percentiles-histogram:
        http.server.requests: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiration-minutes: 15
    refresh-expiration-days: 7
    # The refresh cookie is only sent over HTTPS when true. Keep false for local http://localhost.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  storage:
    # Where uploaded photos are kept. In Docker this is a volume (see infra/docker-compose.yml).
    dir: ${PHOTO_STORAGE_DIR:./data/photos}
  rate-limit:
    enabled: true
    login-per-minute: 10   # per IP address
    max-failed-logins: 5   # per account, in 15 minutes
